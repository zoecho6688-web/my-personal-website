<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我想你</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
   
   <style>
        :root {
            /* 默认是白天模式的颜色 */
            --bg-color-1: #ee7752;
            --bg-color-2: #e73c7e;
            --bg-color-3: #23a6d5;

            --bg-color: #f0f2f5; /* 保底色 */
            --card-bg: rgba(255, 255, 255, 0.3);
            --text-color: #333;
        }
        [data-theme="dark"] {
            /* 黑夜模式下的颜色 */
            --bg-color-1: #0f2027;
            --bg-color-2: #203a43;
            --bg-color-3: #2c5364;
            
            --bg-color: #1a1a1a; /* 保底色 */
            --card-bg: rgba(0,0,0,0.3);
            --text-color: #f0f2f5;
        }
        [data-theme="dark"] button {
            border: 1px solid var(--text-color);
        }
        /* 然后把你的 body 和 card 里的固定颜色换成变量 */
        body {
            font-family: 'Poppins', sans-serif;

            background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
            background-size: 400% 400%; /* 把背景放大到 4 倍，这样才有流动的空间 */
            /* 这样背景就会跟着变量走 */
            animation: gradientMove 15s ease infinite;
            color: var(--text-color);
            transition: all 0.5s ease; /* 让变色过程丝滑一点 */
            display: flex;             /* 开启弹性布局 */
            justify-content: center;    /* 水平居中 */
            align-items: center;        /* 垂直居中 */
            min-height: 100vh;          /* 让 body 至少跟屏幕一样高，否则垂直居中没参照 */
            margin: 0;
        }

        .card {
            width: 450px; /* 电脑端给它一个精致的宽度 */
            max-width: 90%; /* 防止在大屏幕的小窗口下溢出 */
            background: var(--card-bg);
            /* 核心：添加模糊滤镜 */
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); /* 兼容苹果浏览器 */
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            color: var(--text-color);
            transition: all 0.4s ease;
            text-align: center;
        }
        /* 专门针对嵌套在 card 里面的 card */
        .card .card {
            background: rgba(255, 255, 255, 0.05); /* 极淡的颜色 */
            box-shadow: none; /* 去掉阴影，避免脏兮兮的感觉 */
            backdrop-filter: none; /* 内部不需要再次模糊 */
        }
        .card:hover {
            /* 1. 向上位移：让卡片往 y 轴负方向（向上）移动 10 像素 */
            transform: translateY(-10px); 
            
            /* 2. 增强阴影：模拟卡片离桌面变远，阴影变得更深、更模糊 */
            /* 语法：水平 垂直 模糊 扩散 颜色 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            
            /* 3. 边框发光：让玻璃的边缘在悬浮时更亮一点 */
            border: 1px solid rgba(255, 255, 255, 0.5); 
        }
        .card h1 {
            font-weight: 600; /* 标题加粗，更有视觉重点 */
            letter-spacing: 1px; /* 字母间距稍微拉开，更有设计感 */
        }

        .card p {
            font-weight: 300; /* 正文用细体，显得更精致 */
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            transform: scale(1.1);
    
            /* 颜色变亮一点 */
            color: #8ab4f8; 
            
            /* 加上一点文字发光效果 */
            text-shadow: 0 0 8px rgba(138, 180, 248, 0.6);
        }
       @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        /* 当屏幕宽度小于 600px 时（典型的手机环境） */
        @media (max-width: 600px) {
            .card {
                width: 95%;          /* 手机上卡片几乎占满，留一点点呼吸缝隙 */
                padding: 1.5rem;      /* 稍微缩小卡片内边距，给按钮留空间 */
                border-radius: 0;
            }

            button {
                width: 100% !important;  /* 按钮变霸道，横跨整行 */
                padding: 20px !important; /* 按钮变厚，非常适合手指点击 */
                font-size: 1.2rem !important; /* 字体调大，清晰易读 */
                margin-top: 10px;
            }
            a {
                display: block;      /* 让链接也变成一整行 */
                margin-top: 20px !important;    /* 给它留出间距，别跟按钮挤在一起 */
                text-align: center;  /* 文字居中 */
             }
        }
    </style>
</head>
<body>
    <div class="card" id="myCard">
        <h1>我想你 😘</h1>
        <img src="me.png" alt="想你" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin: 20px 0; border: 3px solid #f0f0f0;">
        
        <div class="card">
            <p id="quote-text">正在加载名言...</p>
            <p id="quote-author" style="font-size: 0.8rem; opacity: 0.8;"></p>
        </div>
            
        <div class="social-links" style="margin-top: 20px;">
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 10px;">通过这些地方找到我：</p>
    
            <div style="display: flex; justify-content: center; gap: 15px;">
                <a href="https://www.xiaohongshu.com" target="_blank" class="social-btn" style="background: #ff2442; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; text-decoration: none;">小红书</a>
        
                <a href="https://github.com/zoecho6688-web" target="_blank" class="social-btn" style="background: #333; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; text-decoration: none;">GitHub</a>
        
                <a href="mailto:zoecho6688@gmail.com?subject=来自你网站的打招呼" class="social-btn" style="background: #3498db; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; text-decoration: none;">发邮件</a>
            </div>
        </div>
        <p>❤️今天也要亲亲你❤️</p>
        <button onclick="changeBg()" style="margin-top: 20px; background: #eee; border: 1px solid #ccc; padding: 5px 10px; border-radius: 5px; cursor: pointer;">
                点我换个心情 ✨
        </button>
        <button onclick="toggleDarkMode()" style="background-color: #333; color: white;">
            🌙 切换模式
        </button>
        <br> <a href="index.html">点击这里返回首页</a>
    </div>
    <script>
    function changeBg() {
        // 准备一组你喜欢的颜色
        var colors = ['#FFF0F5', '#F0FFF4', '#EBF8FF', '#FFFAF0', '#F5F5F5'];
    
        // 随机选一个颜色
        var randomColor = colors[Math.floor(Math.random() * colors.length)];
    
        // 把网页背景（body）换成这个颜色
        document.getElementById('myCard').style.backgroundColor = randomColor;
    }
    function toggleDarkMode() {
        // 找到网页的最顶层元素 (html)
        const root = document.documentElement;
        
        // 检查现在是不是黑夜模式
        if (root.getAttribute('data-theme') === 'dark') {
            // 如果是，就换回白天
            root.removeAttribute('data-theme');
        } else {
            // 如果不是，就换成黑夜
            root.setAttribute('data-theme', 'dark');
        }
    }
    async function fetchQuote() {
        try {
            // 尝试换成这个更现代、稳定的 API
            const response = await fetch('https://api.freeapi.app/api/v1/public/quotes/quote/random');
            const result = await response.json();

            // 注意：不同的 API 返回的数据结构（名字）不一样
            // 这个 API 的名言在 result.data.content，作者在 result.data.author
            document.getElementById('quote-text').innerText = `“${result.data.content}”`;
            document.getElementById('quote-author').innerText = `—— ${result.data.author}`;
        } catch (error) {
            // 如果上面那个也失败了，我们试试最简单的随机名言（无须网络，作为保底）
            const localQuotes = [
                { text: "Stay hungry, stay foolish.", author: "Steve Jobs" },
                { text: "Code is like humor. When you have to explain it, it’s bad.", author: "Cory House" }
            ];
            const random = localQuotes[Math.floor(Math.random() * localQuotes.length)];
            document.getElementById('quote-text').innerText = `“${random.text}”`;
            document.getElementById('quote-author').innerText = `—— ${random.author}`;
        }
    }

    // 3. 页面一加载就运行这个函数
    fetchQuote();
    </script>
</body>
</html>
